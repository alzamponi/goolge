<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário → Google Sheets</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 40px auto;
      padding: 0 20px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      box-sizing: border-box;
    }
    button {
      background: #1a73e8;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Formulário</h2>
  <input type="text" id="nome" placeholder="Nome">
  <input type="email" id="email" placeholder="E-mail">
  <button onclick="enviar()">Enviar</button>
  <script>
  // Troca o que o botão chama
  async function enviar() {
    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const URL = "https://script.google.com/macros/s/AKfycbw3FAb06ytTPOsu3gM4TukfTk_kceB3G6uF22FXCOUbVLslX0hdgJmtJ8_RSKA2UEII1g/exec"
              + "?nome=" + encodeURIComponent(nome)
              + "&email=" + encodeURIComponent(email);

    try {
      await fetch(URL); // GET simples, sem no-cors, sem corpo
      document.getElementById("status").textContent = "Enviado com sucesso!";
    } catch (e) {
      document.getElementById("status").textContent = "Erro: " + e.message;
    }
  }
</script>
</body>
</html>
