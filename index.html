<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário → Google Sheets</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 420px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f7fa;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 { margin-top: 0; color: #202124; }
    label { display: block; margin: 12px 0 4px; font-size: 14px; color: #5f6368; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 15px;
    }
    input:focus { outline: 2px solid #1a73e8; border-color: transparent; }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #1765cc; }
    button:disabled { background: #a1c2f5; cursor: not-allowed; }
    #status { margin-top: 14px; font-weight: bold; font-size: 15px; }
    .ok { color: #188038; }
    .erro { color: #d93025; }
  </style>
</head>
<body>
  
    <h2>Cadastro</h2>

    <label for="nome">Nome</label>
    <input type="text" id="nome" placeholder="Seu nome">

    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="voce@exemplo.com">

    <button id="btn" onclick="enviar()">Enviar</button>
    


  



  <script>
    // ⚠️ TROQUE pelo seu Web App (passo 3)
    const URL_BASE = "https://script.google.com/macros/s/AKfycbzab8t9XGxOJ5_EZWTuIaIgBbOTKv_ek9eWgsMQA0XOKfbhlKWqWTxd1NtXdzUfAgD10w/exec";

    async function enviar() {
      const nome  = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const status = document.getElementById("status");
      const btn = document.getElementById("btn");

      // Validação simples
      if (!nome || !email) {
        status.textContent = "Preencha nome e e-mail.";
        status.className = "erro";
        return;
      }

      // Monta a URL com a query string
      const url = URL_BASE
        + "?nome="  + encodeURIComponent(nome)
        + "&email=" + encodeURIComponent(email);

      btn.disabled = true;
      status.textContent = "Enviando...";
      status.className = "";

      try {
        await fetch(url); // GET simples
        status.textContent = "Enviado com sucesso!";
        status.className = "ok";
        document.getElementById("nome").value = "";
        document.getElementById("email").value = "";
      } catch (e) {
        status.textContent = "Erro: " + e.message;
        status.className = "erro";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
